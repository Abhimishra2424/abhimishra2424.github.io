<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found</title><meta name="description" content=""><style>
:root{--bg:#eef4fa;--card:#ffffff;--ink:#1a2028;--muted:#5a6478;--accent:#2a7ad8;--line:#d8e2ee}
@media (prefers-color-scheme:dark){:root{--bg:#121a24;--card:#1c2632;--ink:#e8eef6;--muted:#9aa6b8;--accent:#6ab0ff;--line:#2c3846}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:16px 0}
h1{font-size:28px;line-height:1.2;margin:8px 0 4px}h2{font-size:20px;margin:26px 0 8px}
a{color:var(--accent)}p,li{color:var(--ink)}.muted{color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.steps li{margin:6px 0}.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:10px 18px;border-radius:999px;font-weight:600}
header{display:flex;gap:12px;align-items:center}.logo{font-size:34px}
footer{margin-top:30px;color:var(--muted);font-size:13px}
</style></head>
<body><main><div class="card"><h1>Page not found</h1><p><a href="/">Back to our games</a></p></div>
<footer>Questions? <a href="mailto:abmishra700@gmail.com">abmishra700@gmail.com</a></footer></main></body></html>
